name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests (uno o más por Scenario)
        run: python -m pytest -q

      - name: Evals golden por agente
        run: python evals/run_evals.py --mode golden

      - name: Trazabilidad spec a tests y avance de changes
        run: python tools/progress.py
