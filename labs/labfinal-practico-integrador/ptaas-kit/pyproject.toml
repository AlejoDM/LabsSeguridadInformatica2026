[project]
name = "ptaas"
version = "0.1.0"
description = "Pentest as a Service (autorizado) — swarm de agentes + harness"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "types-PyYAML"]
live = ["anthropic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
